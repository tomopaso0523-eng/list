<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="持ち物">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>持ち物リスト</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --sub:#8E8E93; --line:#E5E5EA;
  --blue:#007AFF; --red:#FF3B30;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:17px;line-height:1.35;
  padding:calc(env(safe-area-inset-top) + 8px) 0 calc(env(safe-area-inset-bottom) + 40px);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}

/* header */
.top{display:flex;align-items:center;justify-content:flex-end;gap:4px;height:44px}
.top button{color:var(--blue);font-size:17px;padding:8px 6px}
.top .reset{display:flex;align-items:center;gap:4px}
.top .reset svg{width:18px;height:18px}
h1{font-size:34px;font-weight:700;letter-spacing:.2px;margin:0 0 2px}
.summary{color:var(--sub);font-size:15px;margin:0 0 14px;min-height:20px}
.summary b{color:var(--text);font-weight:600}
.summary.done{color:#34C759;font-weight:600}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 18px;padding:2px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;
  background:var(--card);font-size:15px;font-weight:600;color:var(--text);
  box-shadow:0 0 0 1px var(--line) inset;transition:background .15s,color .15s}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--c);color:#fff;box-shadow:none}
.chip.on .dot{background:#fff}

/* sections */
.sec{margin-bottom:22px}
.sec-head{display:flex;align-items:center;gap:8px;padding:0 4px 7px}
.sec-head .bar{width:4px;height:16px;border-radius:2px;background:var(--c)}
.sec-head .name{font-size:15px;font-weight:700;color:var(--text)}
.sec-head .count{margin-left:auto;font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums}
.sec-head .count.full{color:var(--c);font-weight:600}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.items{min-height:4px}

.row{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;position:relative;background:var(--card);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row + .row::before,.add-row::before{content:"";position:absolute;top:0;left:50px;right:0;height:1px;background:var(--line)}
.items:empty + .add-row::before{display:none}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #C7C7CC;display:grid;place-items:center;transition:all .15s}
.check svg{width:14px;height:14px;opacity:0;transform:scale(.6);transition:all .15s}
.row.done .check{background:var(--c);border-color:var(--c)}
.row.done .check svg{opacity:1;transform:scale(1)}
.row .label{flex:1;padding:13px 0;word-break:break-word}
.row.done .label{color:#AEAEB2;text-decoration:line-through;text-decoration-color:#C7C7CC}

.add-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;position:relative;color:var(--c)}
.add-row .plus{width:24px;text-align:center;font-size:22px;font-weight:400;line-height:1}
.add-row button{flex:1;text-align:left;padding:13px 0;color:var(--c);font-size:16px}
.add-row input{flex:1;border:0;outline:0;background:none;padding:13px 0;font-size:17px}

/* edit mode */
.del{flex:none;width:22px;height:22px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.del::after{content:"";width:10px;height:2px;background:#fff;border-radius:1px}
.handle{flex:none;width:28px;height:36px;display:grid;place-items:center;color:#C7C7CC;touch-action:none;cursor:grab}
.handle svg{width:18px;height:18px}
.row input.edit{flex:1;border:0;outline:0;background:none;padding:13px 0;font-size:17px;min-width:0}
.edit-head{background:var(--card);border-radius:14px;padding:6px 6px 6px 10px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.edit-head input{flex:1;min-width:0;border:0;outline:0;background:none;font-weight:700;font-size:16px;padding:8px 0}
.color-btn{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line)}
.base-toggle{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);padding:4px}
.switch{width:40px;height:24px;border-radius:12px;background:#E9E9EB;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:#34C759}
.switch.on::after{transform:translateX(16px)}
.trash{flex:none;width:34px;height:34px;display:grid;place-items:center;color:var(--red)}
.trash svg{width:19px;height:19px}
.add-cat{display:block;width:100%;background:var(--card);border-radius:14px;padding:14px;color:var(--blue);font-weight:600;text-align:center;margin-top:4px}
.hint{color:var(--sub);font-size:13px;text-align:center;margin:18px 8px 0;line-height:1.6}
.backup-title{font-size:13px;color:var(--sub);margin:28px 4px 7px}
.backup{background:var(--card);border-radius:14px;overflow:hidden}
.backup button{display:block;width:100%;text-align:left;padding:14px;color:var(--blue);font-size:16px;position:relative}
.backup button + button::before{content:"";position:absolute;top:0;left:14px;right:0;height:1px;background:var(--line)}
.backup-note{color:var(--sub);font-size:12px;margin:7px 4px 0;line-height:1.5}

/* sortable */
.sortable-ghost{opacity:.35}
.sortable-chosen.row{box-shadow:0 8px 24px rgba(0,0,0,.15);border-radius:12px;z-index:2}
.sortable-drag{opacity:.95}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .2s}
.sheet{width:100%;max-width:560px;padding:0 10px calc(env(safe-area-inset-bottom) + 10px);animation:up .25s cubic-bezier(.2,.9,.3,1)}
.sheet .box{background:rgba(255,255,255,.97);border-radius:14px;overflow:hidden;margin-bottom:8px}
.sheet .msg{padding:16px;text-align:center;color:var(--sub);font-size:13px;border-bottom:1px solid var(--line)}
.sheet button{display:block;width:100%;padding:17px;font-size:19px;color:var(--blue)}
.sheet button.danger{color:var(--red)}
.sheet button.cancel{background:#fff;border-radius:14px;font-weight:600}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:rgba(28,28,30,.92);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:15px;font-weight:600;z-index:60;animation:fade .2s;white-space:nowrap}
.foot{color:#AEAEB2;font-size:12px;text-align:center;margin-top:26px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
var KEY = "packlist.v1";
var COLORS = ["#007AFF","#FF2D55","#34C759","#FF9500","#AF52DE","#30B0C7","#5856D6","#FF3B30","#A2845E"];
var ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
var ICON_HANDLE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>';
var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg>';
var ICON_RESET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>';

function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

function cat(name, color, base, list){
  return { id: uid(), name: name, color: color, base: base, on: base, items: list.map(function(n){ return { id: uid(), name: n, done: false }; }) };
}
function defaults(){
  return { updatedAt: 0, categories: [
    cat("ベース荷物", COLORS[0], true, ["スマホ","イヤホン","充電器","モバイル充電器","ウエットティッシュ","ティッシュ","長袖","上の服","下の服","下着","靴下","パジャマ","シャンプー","化粧水","美容液","髭剃り","コンタクトレンズ","メガネケース"]),
    cat("ライブ", COLORS[1], false, ["タオル","ライトバンド","ぬいぐるみ","トートバッグ","フライヤー用カードケース"]),
    cat("海外", COLORS[2], false, ["セキュリティポーチ","パスポート","除菌シート","スリッパ","カード","水のペットボトル","カップ麺","割り箸","スプーン","折りたたみ傘","ネックピロー","エコバッグ"])
  ]};
}
function valid(s){ return s && Array.isArray(s.categories); }
function loadLocal(){ try { var s = JSON.parse(localStorage.getItem(KEY)); return valid(s) ? s : null; } catch(e){ return null; } }
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

var state = loadLocal() || defaults();
var editing = false;
var addingCat = null;      // category id with open add input
var focusAfter = null;     // selector to focus after render
var sortables = [];
var syncLabel = "この端末に保存";

/* ---------- cloud sync (claude db) ---------- */
var ref = null, saving = false, again = false, timer = null, syncOff = false;
function commit(skipRender){
  state.updatedAt = Date.now();
  saveLocal();
  if (ref && !syncOff){ clearTimeout(timer); timer = setTimeout(flush, 500); }
  if (!skipRender) render();
}
function flush(){
  timer = null;
  if (!ref || syncOff) return;
  if (saving){ again = true; return; }
  saving = true;
  var body = { state: JSON.parse(JSON.stringify(state)) };
  ref.set(body).then(function(){ setSync("☁︎ 同期済み"); }, function(e){
    if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { syncOff = true; setSync("この端末に保存"); }
  }).then(function(){ saving = false; if (again){ again = false; flush(); } });
}
function setSync(t){ syncLabel = t; var f = document.getElementById("sync"); if (f) f.textContent = t; }
function typing(){ var a = document.activeElement; return a && a.tagName === "INPUT"; }
var pendingRemote = null;
function applyRemote(r){
  if (!valid(r) || (r.updatedAt||0) <= (state.updatedAt||0)) return;
  if (typing() || dragging){ pendingRemote = r; return; }
  state = r; saveLocal(); render();
}
function startSync(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  window.claude.use("db").then(function(db){
    if (!db) return;
    ref = db.doc("app/state");
    var first = true;
    ref.onSnapshot(function(snap){
      if (snap.metadata && snap.metadata.hasPendingWrites) return;
      if (timer || saving) return;
      if (snap.exists){
        var d = snap.data(); applyRemote(d && d.state);
        setSync("☁︎ 同期済み");
      } else if (!snap.metadata || !snap.metadata.fromCache){
        if (first){ first = false; flush(); }
      }
    }, function(){ setSync("この端末に保存"); });
  }).catch(function(){});
}
document.addEventListener("focusout", function(){ setTimeout(function(){ if (pendingRemote && !typing()){ var r = pendingRemote; pendingRemote = null; applyRemote(r); } }, 50); });

/* ---------- helpers ---------- */
function findCat(id){ for (var i=0;i<state.categories.length;i++) if (state.categories[i].id===id) return state.categories[i]; return null; }
function findItem(id){
  for (var i=0;i<state.categories.length;i++){ var c=state.categories[i];
    for (var j=0;j<c.items.length;j++) if (c.items[j].id===id) return { cat:c, item:c.items[j], index:j };
  } return null;
}
function visibleCats(){ return state.categories.filter(function(c){ return editing || c.base || c.on; }); }
function buzz(){ try { navigator.vibrate && navigator.vibrate(8); } catch(e){} }

/* ---------- render ---------- */
var app = document.getElementById("app");
function render(){
  sortables.forEach(function(s){ try{ s.destroy(); }catch(e){} }); sortables = [];
  var cats = visibleCats();
  var total = 0, done = 0;
  if (!editing) cats.forEach(function(c){ total += c.items.length; c.items.forEach(function(it){ if (it.done) done++; }); });

  var h = '';
  h += '<div class="top">';
  if (!editing) h += '<button class="reset" data-act="reset">'+ICON_RESET+'リセット</button>';
  h += '<button data-act="edit" style="font-weight:'+(editing?'600':'400')+'">'+(editing?'完了':'編集')+'</button></div>';
  h += '<h1>持ち物</h1>';
  if (editing) h += '<p class="summary">ドラッグで並べ替え・タップで名前を変更</p>';
  else if (total && done === total) h += '<p class="summary done">✓ 全部そろった！いってらっしゃい</p>';
  else h += '<p class="summary"><b>'+done+'</b> / '+total+' 個 準備OK</p>';

  if (!editing){
    var opt = state.categories.filter(function(c){ return !c.base; });
    if (opt.length){
      h += '<div class="chips">';
      opt.forEach(function(c){ h += '<button class="chip'+(c.on?' on':'')+'" style="--c:'+c.color+'" data-act="toggle" data-cat="'+c.id+'"><span class="dot"></span>'+esc(c.name)+'</button>'; });
      h += '</div>';
    }
  }

  h += '<div id="secs">';
  cats.forEach(function(c){
    var cd = c.items.filter(function(i){ return i.done; }).length;
    h += '<section class="sec" data-cat="'+c.id+'" style="--c:'+c.color+'">';
    if (editing){
      h += '<div class="edit-head"><span class="handle sec-handle">'+ICON_HANDLE+'</span>'
        + '<input class="cat-name" data-cat="'+c.id+'" value="'+esc(c.name)+'" enterkeyhint="done">'
        + '<button class="color-btn" data-act="color" data-cat="'+c.id+'" aria-label="色"></button>'
        + '<button class="base-toggle" data-act="base" data-cat="'+c.id+'">常に<span class="switch'+(c.base?' on':'')+'"></span></button>'
        + '<button class="trash" data-act="delcat" data-cat="'+c.id+'" aria-label="削除">'+ICON_TRASH+'</button></div>';
    } else {
      h += '<div class="sec-head"><span class="bar"></span><span class="name">'+esc(c.name)+'</span>'
        + '<span class="count'+(c.items.length && cd===c.items.length?' full':'')+'">'+cd+'/'+c.items.length+'</span></div>';
    }
    h += '<div class="card"><div class="items" data-cat="'+c.id+'">';
    c.items.forEach(function(it){
      if (editing){
        h += '<div class="row" data-item="'+it.id+'"><button class="del" data-act="delitem" data-item="'+it.id+'" aria-label="削除"></button>'
          + '<input class="edit" data-item="'+it.id+'" value="'+esc(it.name)+'" enterkeyhint="done">'
          + '<span class="handle">'+ICON_HANDLE+'</span></div>';
      } else {
        h += '<div class="row'+(it.done?' done':'')+'" data-act="check" data-item="'+it.id+'"><span class="check">'+ICON_CHECK+'</span><span class="label">'+esc(it.name)+'</span></div>';
      }
    });
    h += '</div>';
    if (addingCat === c.id){
      h += '<div class="add-row"><span class="plus">＋</span><input class="add-input" data-cat="'+c.id+'" placeholder="持ち物を入力" enterkeyhint="done" autocomplete="off"></div>';
    } else {
      h += '<div class="add-row"><span class="plus">＋</span><button data-act="add" data-cat="'+c.id+'">追加</button></div>';
    }
    h += '</div></section>';
  });
  h += '</div>';

  if (editing){
    h += '<button class="add-cat" data-act="addcat">＋ カテゴリを追加</button>';
    h += '<p class="hint">「常に」をONにしたカテゴリは毎回表示されます。<br>OFFのカテゴリは上のボタンで出し分けできます。</p>';
    h += '<div class="backup-title">バックアップ</div><div class="backup">'
      + '<button data-act="export">バックアップを書き出す</button>'
      + '<button data-act="import">バックアップを読み込む</button></div>'
      + '<p class="backup-note">データはこの端末のブラウザの中だけに保存されます。機種変更の前などに書き出しておくと、読み込んで元に戻せます。</p>';
  } else {
    h += '<p class="hint">長押しでドラッグして並べ替えできます</p>';
  }
  h += '<div class="foot" id="sync">'+esc(syncLabel)+'</div>';
  app.innerHTML = h;

  setupSortable();
  if (focusAfter){ var el = app.querySelector(focusAfter); focusAfter = null; if (el){ el.focus(); if (el.select) el.select(); } }
}

/* ---------- drag & drop ---------- */
var dragging = false;
function setupSortable(){
  if (typeof Sortable === "undefined") return;
  var base = { animation: 180, ghostClass: "sortable-ghost", chosenClass: "sortable-chosen", dragClass: "sortable-drag",
    onStart: function(){ dragging = true; buzz(); }, onEnd: function(){ dragging = false; syncOrderFromDom(); } };
  app.querySelectorAll(".items").forEach(function(list){
    var o = Object.assign({}, base, { group: "items", draggable: ".row" });
    if (editing){ o.handle = ".handle"; }
    else { o.delay = 280; o.delayOnTouchOnly = true; o.touchStartThreshold = 6; }
    sortables.push(Sortable.create(list, o));
  });
  if (editing){
    var secs = document.getElementById("secs");
    sortables.push(Sortable.create(secs, Object.assign({}, base, { handle: ".sec-handle", draggable: ".sec" })));
  }
}
function syncOrderFromDom(){
  var byId = {};
  state.categories.forEach(function(c){ c.items.forEach(function(it){ byId[it.id] = it; }); });
  // items
  app.querySelectorAll(".items").forEach(function(list){
    var c = findCat(list.getAttribute("data-cat")); if (!c) return;
    c.items = Array.prototype.map.call(list.querySelectorAll(".row"), function(r){ return byId[r.getAttribute("data-item")]; }).filter(Boolean);
  });
  // categories (visible ones reorder in place, hidden ones keep relative spots)
  var shownIds = Array.prototype.map.call(app.querySelectorAll("#secs > .sec"), function(s){ return s.getAttribute("data-cat"); });
  var shownSet = {}; shownIds.forEach(function(id){ shownSet[id]=1; });
  var queue = shownIds.slice();
  state.categories = state.categories.map(function(c){ return shownSet[c.id] ? findCat(queue.shift()) : c; });
  commit();
}

/* ---------- events ---------- */
app.addEventListener("click", function(e){
  var t = e.target.closest("[data-act]"); if (!t) return;
  var act = t.getAttribute("data-act");
  var cid = t.getAttribute("data-cat"), iid = t.getAttribute("data-item");
  if (act === "check"){
    var f = findItem(iid); if (!f) return;
    f.item.done = !f.item.done; buzz();
    commit();
    var all = visibleCats().every(function(c){ return c.items.every(function(i){ return i.done; }); });
    if (f.item.done && all) toast("全部そろった！🎉");
  } else if (act === "toggle"){
    var c = findCat(cid); c.on = !c.on; commit();
  } else if (act === "edit"){
    blurAll(); editing = !editing; addingCat = null; render(); window.scrollTo(0,0);
  } else if (act === "reset"){
    sheet("チェックを全部外しますか？", "リセット", function(){ state.categories.forEach(function(c){ c.items.forEach(function(i){ i.done=false; }); }); commit(); toast("リセットしました"); });
  } else if (act === "add"){
    addingCat = cid; focusAfter = '.add-input[data-cat="'+cid+'"]'; render();
  } else if (act === "delitem"){
    var f2 = findItem(iid); if (!f2) return;
    var removed = f2.cat.items.splice(f2.index,1)[0]; commit();
    toast("「"+removed.name+"」を削除しました", "元に戻す", function(){ f2.cat.items.splice(f2.index,0,removed); commit(); });
  } else if (act === "color"){
    var c2 = findCat(cid); c2.color = COLORS[(COLORS.indexOf(c2.color)+1) % COLORS.length]; commit();
  } else if (act === "base"){
    var c3 = findCat(cid); c3.base = !c3.base; if (!c3.base) c3.on = true; commit();
  } else if (act === "delcat"){
    var c4 = findCat(cid);
    sheet("「"+c4.name+"」と中の持ち物"+c4.items.length+"個を削除しますか？", "カテゴリを削除", function(){
      state.categories = state.categories.filter(function(x){ return x.id !== cid; }); commit();
    });
  } else if (act === "addcat"){
    var nc = { id: uid(), name: "新しいカテゴリ", color: COLORS[state.categories.length % COLORS.length], base: false, on: true, items: [] };
    state.categories.push(nc); focusAfter = '.cat-name[data-cat="'+nc.id+'"]'; commit();
    setTimeout(function(){ var el = app.querySelector('.cat-name[data-cat="'+nc.id+'"]'); if (el) el.scrollIntoView({block:"center",behavior:"smooth"}); }, 30);
  } else if (act === "export"){
    exportBackup();
  } else if (act === "import"){
    importBackup();
  }
});

/* ---------- backup ---------- */
function exportBackup(){
  try {
    var d = new Date(), p = function(n){ return (n<10?"0":"")+n; };
    var name = "packlist-backup-"+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+".json";
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("書き出しました");
  } catch(e){ toast("書き出しに失敗しました"); }
}
function importBackup(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = function(){
    var file = inp.files && inp.files[0]; if (!file) return;
    var r = new FileReader();
    r.onload = function(){
      var data; try { data = JSON.parse(r.result); } catch(e){ data = null; }
      if (!valid(data)){ toast("このファイルは読み込めません"); return; }
      var n = 0; data.categories.forEach(function(c){ n += (c.items||[]).length; });
      sheet("今のデータを、バックアップ（カテゴリ"+data.categories.length+"個・持ち物"+n+"個）に置き換えますか？", "読み込む", function(){
        data.categories.forEach(function(c){
          c.id = c.id || uid(); c.name = String(c.name || "カテゴリ"); c.color = c.color || COLORS[0];
          c.base = !!c.base; c.on = !!c.on;
          c.items = (Array.isArray(c.items) ? c.items : []).map(function(i){ return { id: i.id || uid(), name: String(i.name || ""), done: !!i.done }; });
        });
        state = data; addingCat = null; commit(); toast("読み込みました");
      });
    };
    r.readAsText(file);
  };
  inp.click();
}

function addFromInput(inp, keepOpen){
  var v = inp.value.trim(); var c = findCat(inp.getAttribute("data-cat"));
  if (v && c){ c.items.push({ id: uid(), name: v, done: false }); }
  if (keepOpen && v){ addingCat = c.id; focusAfter = '.add-input[data-cat="'+c.id+'"]'; }
  else addingCat = null;
  if (v) commit(); else render();
}
app.addEventListener("keydown", function(e){
  if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return;
  var t = e.target;
  if (t.classList.contains("add-input")){ e.preventDefault(); addFromInput(t, true); }
  else if (t.classList.contains("edit") || t.classList.contains("cat-name")){ e.preventDefault(); t.blur(); }
});
app.addEventListener("focusout", function(e){
  var t = e.target;
  if (t.classList && t.classList.contains("add-input")){
    // delay so a tap on another control still registers
    setTimeout(function(){ if (document.body.contains(t)) addFromInput(t, false); }, 120);
  }
});
app.addEventListener("change", function(e){
  var t = e.target, v = t.value.trim();
  if (t.classList.contains("edit")){
    var f = findItem(t.getAttribute("data-item")); if (!f) return;
    if (!v){ t.value = f.item.name; return; }
    if (v !== f.item.name){ f.item.name = v; commit(true); }
  } else if (t.classList.contains("cat-name")){
    var c = findCat(t.getAttribute("data-cat")); if (!c) return;
    if (!v){ t.value = c.name; return; }
    if (v !== c.name){ c.name = v; commit(true); }
  }
});
function blurAll(){ var a = document.activeElement; if (a && a.blur) a.blur(); }

/* ---------- sheet & toast ---------- */
function sheet(msg, label, onOk){
  var o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = '<div class="sheet"><div class="box"><div class="msg">'+esc(msg)+'</div><button class="danger">'+esc(label)+'</button></div><button class="cancel">キャンセル</button></div>';
  function close(){ o.remove(); }
  o.addEventListener("click", function(e){ if (e.target === o) close(); });
  o.querySelector(".danger").onclick = function(){ close(); onOk(); };
  o.querySelector(".cancel").onclick = close;
  document.body.appendChild(o);
}
var toastEl = null, toastTimer = null;
function toast(text, actionLabel, action){
  if (toastEl) toastEl.remove(); clearTimeout(toastTimer);
  toastEl = document.createElement("div"); toastEl.className = "toast";
  toastEl.innerHTML = esc(text) + (actionLabel ? ' <button style="color:#64D2FF;font-weight:700;margin-left:10px">'+esc(actionLabel)+'</button>' : '');
  if (actionLabel){ toastEl.querySelector("button").onclick = function(){ toastEl.remove(); toastEl = null; action(); }; }
  document.body.appendChild(toastEl);
  var el = toastEl; toastTimer = setTimeout(function(){ el.remove(); if (toastEl === el) toastEl = null; }, actionLabel ? 4000 : 1800);
}

render();
startSync();
if ("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
})();
</script>
</body>
